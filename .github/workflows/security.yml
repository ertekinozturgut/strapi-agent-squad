name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm install --global pnpm@10.34.5
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Build package artifact
        run: pnpm pack --pack-destination .tmp/artifacts
      - name: Install pinned Gitleaks
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output .tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  .tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf .tmp/gitleaks.tar.gz -C .tmp gitleaks
      - name: Scan Git history, worktree, and build artifacts
        run: |
          .tmp/gitleaks git . --config .gitleaks.toml --redact --log-opts=--all
          .tmp/gitleaks dir . --config .gitleaks.toml --redact
          mkdir -p /tmp/strapi-agent-squad-artifact
          tar -xzf .tmp/artifacts/strapi-agent-squad-1.0.0.tgz -C /tmp/strapi-agent-squad-artifact
          .tmp/gitleaks dir /tmp/strapi-agent-squad-artifact --config .gitleaks.toml --redact
      - run: python -m pip install --disable-pip-version-check semgrep==1.178.0
      - run: semgrep scan --config .semgrep/strapi-security.yml --exclude fixtures/vulnerable --error
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
      - uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: .tmp/sbom.cdx.json
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: javascript-typescript
          queries: ./.codeql/queries/strapi-security.qls
      - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
