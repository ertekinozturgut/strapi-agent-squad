trigger:
  branches:
    include: [main, dev, staging]

pool:
  vmImage: ubuntu-latest

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '22.x'
  - script: npm install --global pnpm@10.34.5
    displayName: Install pinned pnpm
  - script: pnpm install --frozen-lockfile
    displayName: Deterministic install
  - script: pnpm squad:testgen:check
    displayName: Generated test drift
  - script: pnpm squad:check
    displayName: Strapi quality and security gate
  - script: pnpm squad:verify
    displayName: Full Strapi verification
